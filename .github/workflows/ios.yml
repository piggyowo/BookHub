name: iOS unsigned IPA
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test quiz and import logic
        run: swift test
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for physical iPhone without signing
        run: |
          xcodebuild -project StudyEdition.xcodeproj -scheme StudyEdition \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGN_IDENTITY='' CODE_SIGN_ENTITLEMENTS='' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package and verify IPA
        run: bash scripts/package-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: StudyEdition-iOS-unsigned
          path: dist/StudyEdition-unsigned.ipa
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-15-intel
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: StudyEdition-iOS-unsigned
          path: dist
      - uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            const fs = require('node:fs');
            const tag = process.env.RELEASE_TAG;
            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `研题册 iOS ${tag}`,
              body: [
                '研题册原生 iOS 刷题应用。',
                '',
                '此 IPA 为未签名的 iPhone 真机包，安装前需要使用自己的签名方式进行签名。',
                '导入支持 UTF-8 TXT、文字版 PDF 和 DOCX 单选题。'
              ].join('\n'),
              draft: false,
              prerelease: true
            });
            const path = 'dist/StudyEdition-unsigned.ipa';
            const { data: asset } = await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              name: 'StudyEdition-iOS-unsigned.ipa',
              data: fs.readFileSync(path),
              headers: { 'content-type': 'application/octet-stream' }
            });
            core.notice(`Published ${asset.name} (${asset.size} bytes) to ${release.html_url}`);
